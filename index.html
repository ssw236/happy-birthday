<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Qi Xuan's Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@500;600&family=ZCOOL+XiaoWei&family=JetBrains+Mono:wght@400;700&family=Pacifico&family=Playfair+Display:ital,wght@1,700;1,800&display=swap">
<style>
/* Layout: one full-screen ASCII stage drawn in WebGL, a terminal caption strip, quiet controls in the corner */
:root{
  --bg:#060308;
  --ink:#ffdbe7;
  --dim:#b08a9b;
  --rose:#ff9cbf;
  --edge:rgba(255,186,212,.22);
  --panel:rgba(6,3,8,.62);
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --serif:"Playfair Display", Georgia, "Times New Roman", serif;
  --hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  --zh:"ZCOOL XiaoWei", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  color-scheme: dark;
}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{color:var(--ink);font-family:var(--mono);-webkit-tap-highlight-color:transparent}
#stage{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
#cv{display:block;width:100%;height:100%}
#term{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 6.5vh);padding-inline:max(20px,env(safe-area-inset-left,0px));text-align:center;font:500 clamp(23px,1.5vw + 15px,36px)/1.2 var(--hand);color:#ffe8f1;letter-spacing:.01em;pointer-events:none;opacity:0;text-shadow:0 0 18px rgba(255,140,185,.5),0 1px 3px rgba(0,0,0,.95)}
#load{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 50% + min(50vw,50vh) * .52);transform:translateX(-50%);text-align:center;pointer-events:none;font:500 clamp(20px,1vw + 15px,28px) var(--hand);color:var(--ink);text-shadow:0 0 14px rgba(255,140,185,.55);white-space:nowrap}
.zh{display:block;font-family:var(--zh);font-weight:400;font-size:.6em;letter-spacing:.14em;color:#f6cfe0;margin-top:.2em}
#term .zh{font-size:.62em}
#tap{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 50% + min(50vw,50vh) * .52 + 4.4em);transform:translateX(-50%);font:500 clamp(18px,1vw + 13px,24px) var(--hand);color:var(--ink);text-align:center;white-space:nowrap;pointer-events:none;text-shadow:0 0 14px rgba(255,140,185,.6);animation:softpulse 2.6s ease-in-out infinite}
@keyframes softpulse{50%{opacity:.5}}
#load .track{margin:.55em auto 0;width:min(52vw,240px);height:2px;border-radius:2px;background:rgba(255,186,212,.16);overflow:hidden}
#load .track i{display:block;height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,#ff8fb8,#ffe3ee);box-shadow:0 0 10px #ff9cbf}
#open{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 50% + min(50vw,50vh) * .52);transform:translateX(-50%);font:600 clamp(22px,1.3vw + 16px,32px) var(--hand);letter-spacing:.02em;color:#ffeaf2;background:rgba(255,150,190,.08);border:1px solid rgba(255,186,212,.4);border-radius:999px;padding:.3em 1.3em .38em;cursor:pointer;text-shadow:0 0 12px rgba(255,140,185,.7);animation:breathe 2.4s ease-in-out infinite;white-space:nowrap}
#open:hover{background:rgba(255,150,190,.14)}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);text-align:center;font-size:12px;letter-spacing:.14em;color:var(--dim);pointer-events:none;animation:blink 2.4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 28px rgba(255,140,185,.35);border-color:rgba(255,186,212,.55)}}
#ctl{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;gap:8px}
#ctl button{font:12px var(--mono);color:var(--dim);background:var(--panel);border:1px solid var(--edge);padding:6px 10px;cursor:pointer;letter-spacing:.04em}
#ctl button:hover{color:var(--ink)}
button:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
#replay{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);font:600 clamp(19px,1vw + 14px,26px) var(--hand);letter-spacing:.02em;color:#ffeaf2;background:rgba(255,150,190,.08);border:1px solid rgba(255,186,212,.4);border-radius:999px;padding:.25em 1.2em .32em;cursor:pointer;text-shadow:0 0 12px rgba(255,140,185,.7);white-space:nowrap;animation:fadein 1.4s ease both,breathe 2.4s ease-in-out 1.4s infinite}
#replay:hover{background:rgba(255,150,190,.16)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#fly{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translateX(-50%);width:min(90vw,560px);box-sizing:border-box;padding:.65em 1.2em .75em;background:rgba(10,6,20,.55);border:1px solid rgba(255,186,212,.3);border-radius:14px;font:700 clamp(14px,1.1vw + 9px,21px) var(--mono);color:#ffe3ee;text-align:center;letter-spacing:.06em;text-shadow:0 0 10px rgba(255,140,185,.55);pointer-events:none}
#fly .route{display:flex;justify-content:space-between;align-items:flex-start}
#fly .route b{display:block;font-size:1.6em;letter-spacing:.05em;line-height:1.1}
#fly .route small{display:block;font-size:.62em;font-weight:400;color:#d9a9bd;letter-spacing:.08em}
#fly .track{position:relative;height:3px;margin:.75em .3em .6em;background:rgba(255,186,212,.18);border-radius:2px}
#fly .track i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:2px;background:linear-gradient(90deg,#ff8fb8,#ffe3ee);box-shadow:0 0 8px #ff9cbf}
#fly .track em{position:absolute;left:0;top:50%;transform:translate(-50%,-55%);font-style:normal;font-size:1.3em;color:#fff}
#fly .info{font-size:.76em;font-weight:400;color:#f3c9da;letter-spacing:.05em}
#final{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);padding-inline:max(16px,env(safe-area-inset-left,0px));text-align:center;pointer-events:none;opacity:0;transition:opacity 1.8s ease}
#final.on{opacity:1}
body.leaving #final{transition:opacity .5s ease}
#final .a{font:italic 700 clamp(15px,1vw + 10px,22px) var(--serif);color:var(--ink);text-shadow:0 0 14px rgba(255,140,185,.65),0 1px 2px rgba(0,0,0,.9)}
#final .zh{font-size:clamp(12px,.5vw + 10px,16px);margin:.15em 0 .35em}
#final .b{margin-top:.35em;font-size:clamp(10px,.3vw + 9px,13px);color:var(--dim);letter-spacing:.08em}
@media (prefers-reduced-motion: reduce){#open,#hint{animation:none}}
/* the gift button and "watch again": rose glass with a soft gradient edge, a breathing glow and a slow shimmer */
#open,#replay{color:#fff1f6;background:linear-gradient(180deg,#5a2645,#341429 55%,#220c1c) padding-box,linear-gradient(120deg,#ffd1e3,#ff8fb8 35%,#e3b0ff 65%,#ffd9c2) border-box;border:1.5px solid transparent;padding:.36em 1.6em .46em;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 8px 26px rgba(255,110,170,.26),0 0 40px rgba(255,140,185,.16);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:filter .25s ease}
#open:hover,#replay:hover{background:linear-gradient(180deg,#6b2d53,#3e1831 55%,#280f21) padding-box,linear-gradient(120deg,#ffe0ec,#ff9cc2 35%,#ecc0ff 65%,#ffe2cf) border-box;filter:brightness(1.08)}
#open:active,#replay:active{filter:brightness(.94)}
#open::before,#replay::before{content:"";position:absolute;left:10%;right:10%;top:2px;height:42%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.2),rgba(255,255,255,0));pointer-events:none}
#open::after,#replay::after{content:"";position:absolute;top:-10%;bottom:-10%;left:-45%;width:30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.32),transparent);transform:skewX(-18deg);animation:shine 4.2s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,62%{left:-45%}92%,100%{left:125%}}
@keyframes breathe{50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.34),0 10px 34px rgba(255,110,170,.42),0 0 58px rgba(255,140,185,.32)}}
#open .zh,#replay .zh{color:#ffdbe9;letter-spacing:.32em;text-indent:.32em;margin-top:0}
#open .zh::before,#replay .zh::before{content:"";display:block;width:2.6em;height:1px;margin:.2em auto .28em;background:linear-gradient(90deg,transparent,rgba(255,214,232,.85),transparent)}
@media (prefers-reduced-motion: reduce){#open::after,#replay::after{animation:none;display:none}}
/* captions sit on a soft, feathered dark oval so they read over any scene */
#term{left:50%;right:auto;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;padding:.4em 2em .5em;border-radius:999px;background:radial-gradient(ellipse at center,rgba(6,2,10,.66) 0%,rgba(6,2,10,.46) 48%,rgba(6,2,10,0) 74%);text-shadow:0 0 18px rgba(255,140,185,.5),0 2px 8px rgba(0,0,0,.95)}
</style>
<div id="stage"><canvas id="cv" role="img" aria-label="Animated ASCII birthday card for Qi Xuan"></canvas></div>
<div id="term" aria-live="polite"></div>
<div id="load" hidden><div>a little something for you</div><div class="zh">送你的一份小心意</div><div class="track"><i></i></div></div>
<div id="tap" hidden>tap to let it bloom &#9835;<span class="zh">轻触屏幕，让它绽放</span></div>
<button id="open" type="button" hidden>open your gift &#9825;<span class="zh">打开你的礼物</span></button>
<button id="replay" type="button" hidden>watch again &#8634;<span class="zh">再看一次</span></button>
<div id="fly" hidden><div class="route"><div><b>YYZ</b><small>Toronto</small></div><div><b>PVG</b><small>Shanghai &#19978;&#28023;</small></div></div><div class="track"><i></i><em>&#9992;&#xFE0E;</em></div><div class="info"></div></div>
<div id="final"><div class="a">January 4 &middot; Toronto &rarr; Shanghai 上海 &middot; welcome home</div><div class="zh">1月4日 · 多伦多 → 上海 · 欢迎回家</div><div class="b">light pink hydrangeas, just for you</div><div class="zh">浅粉色的绣球花，只送给你</div></div>
<script>
'use strict';
/* =====================================================================
   ASCII engine: every scene paints colour + brightness into a character

   ===================================================================== */

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);

    s = (s + 0x6D2B79F5) >>> 0; let t = s;

    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

}
const PERM = new Uint8Array(512), GRAD = new Float32Array(256);
{
  const r = rng(7), p = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; }

  for (let i = 0; i < 256; i++) GRAD[i] = r();
}
function noise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, X = xi & 255, Y = yi & 255;
  const a = GRAD[PERM[X + PERM[Y]]], b = GRAD[PERM[X + 1 + PERM[Y]]];
  const c = GRAD[PERM[X + PERM[Y + 1]]], d = GRAD[PERM[X + 1 + PERM[Y + 1]]];
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);

// ---------- palettes / fonts ----------
const PINKS = [[1, .7, .8], [1, .64, .76], [.98, .76, .85], [1, .8, .87], [.96, .7, .84], [1, .9, .93]];
const PASTEL = [[1, .62, .78], [1, .85, .55], [.7, .85, 1], [.65, 1, .85], [.9, .75, 1], [1, 1, 1]];
const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98, 1760, 2093];
const MONO = '"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace';
const SERIF = '"Playfair Display", Georgia, "Times New Roman", serif';
const BLACK = '"Archivo Black", "Arial Black", Impact, sans-serif';
const RAMP = ' .,:-=+*ox#%@';
const RAMPC = Array.from(RAMP, c => c.charCodeAt(0)), RN = RAMPC.length;
const NG = 95; // printable ASCII 32..126

// ---------- DOM ----------
const stage = document.getElementById('stage'), cv = document.getElementById('cv');
const term = document.getElementById('term'), openBtn = document.getElementById('open');
const replayBtn = document.getElementById('replay'), finalEl = document.getElementById('final');
const flyEl = document.getElementById('fly'), flyBar = flyEl.querySelector('.track i'), flyPlane = flyEl.querySelector('.track em'), flyInfo = flyEl.querySelector('.info');
const tapEl = document.getElementById('tap'), loadEl = document.getElementById('load'), loadBar = loadEl.querySelector('i');

// ---------- grid state ----------
let DPR = 1, W = 1, H = 1, WD = 1, HD = 1, GW = 6, GH = 10, COLS = 1, ROWS = 1, N = 1;
let OXD = 0, OYD = 0, CW = 6, CH = 10, S = 1;
let R, G, B, GL, PX, PY, U, V, HSH, DATA;

const cx_ = px => (px * DPR - OXD) / GW - .5;   // css px -> fractional cell column
const cy_ = py => (py * DPR - OYD) / GH - .5;   // css px -> fractional cell row

function layout() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, stage.clientWidth); H = Math.max(1, stage.clientHeight);
  WD = Math.max(1, Math.round(W * DPR)); HD = Math.max(1, Math.round(H * DPR));
  const target = clamp(W / (W < 700 ? 4.5 : 5.0), 60, 300);   // fine grid for detail; a little denser on phones
  GW = Math.max(4, Math.round(WD / target)); GH = Math.round(GW * 1.72);
  COLS = Math.max(1, Math.floor(WD / GW)); ROWS = Math.max(1, Math.floor(HD / GH)); N = COLS * ROWS;

  CW = GW / DPR; CH = GH / DPR; S = Math.min(W, H) / 2;
  cv.width = WD; cv.height = HD;
  R = new Float32Array(N); G = new Float32Array(N); B = new Float32Array(N); GL = new Int16Array(N);
  PX = new Float32Array(N); PY = new Float32Array(N); U = new Float32Array(N); V = new Float32Array(N);
  HSH = new Float32Array(N); DATA = new Uint8ClampedArray(N * 4);
  for (let y = 0, i = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++, i++) {
    PX[i] = (OXD + (x + .5) * GW) / DPR; PY[i] = (OYD + (y + .5) * GH) / DPR;
    U[i] = (PX[i] - W / 2) / S; V[i] = (PY[i] - H / 2) / S; HSH[i] = hash(i * 1.618 + .5);

}

// ---------- painting helpers ----------
function cellIdx(px, py) {
  const x = Math.round(cx_(px)), y = Math.round(cy_(py));
  return (x < 0 || y < 0 || x >= COLS || y >= ROWS) ? -1 : y * COLS + x;

function put(px, py, r, g, b, ch = -1) { const i = cellIdx(px, py); if (i >= 0) { R[i] = r; G[i] = g; B[i] = b; GL[i] = ch; } return i; }

// visit every cell whose centre lies inside a css-px rectangle
function box(px0, py0, px1, py1, fn) {
  const x0 = Math.max(0, Math.ceil(cx_(px0))), x1 = Math.min(COLS - 1, Math.floor(cx_(px1)));
  const y0 = Math.max(0, Math.ceil(cy_(py0))), y1 = Math.min(ROWS - 1, Math.floor(cy_(py1)));

function slopeGlyph(dx, dy) {
  let a = Math.atan2(-dy, dx) * 57.29578; if (a < 0) a += 180; if (a >= 180) a -= 180;

}
// straight line drawn with slope glyphs; f = fraction drawn, skip = gap (in cell widths) at both ends
function lineSeg(x0, y0, x1, y1, f, r, g, b, I = 1, skip = 0, ch) {
  const a0 = cx_(x0), b0 = cy_(y0), a1 = cx_(x1), b1 = cy_(y1);
  const n = Math.max(1, Math.ceil(Math.max(Math.abs(a1 - a0), Math.abs(b1 - b0)) * 1.3));
  const gch = ch === undefined ? slopeGlyph(x1 - x0, y1 - y0) : ch, m = Math.floor(n * clamp(f)), asp = GH / GW;
  for (let s = 0; s <= m; s++) {

  }
}
function textAt(px, py, s, r, g, b, align = 'left') {
  let x0 = Math.round(cx_(px)); const y = Math.round(cy_(py));

  if (y < 0 || y >= ROWS) return;
  for (let k = 0; k < s.length; k++) {
    const x = x0 + k, c = s.charCodeAt(k);

// ---------- text masks (big letters made of characters) ----------
const MC = document.createElement('canvas').getContext('2d');
function fitFont(text, fontFn, maxW, maxH) {
  MC.font = fontFn(100); const w = MC.measureText(text).width || 1;

// smooth curve through control points (Catmull-Rom), returned as a dense polyline
function catmull(pts, closed, per = 8) {

// a waltz under the tune: bass on beat one, harp on two and three ("oom-pah-pah"); [bass, harp, harp] as midi notes

      if (lA > 0) loop(cx - .2 * bq * lA, bowY - .03 * bq, .19 * bq * lA, .1 * bq * lA, -.3 - .6 * (1 - lA) + sw);
      if (rA > 0) loop(cx + .2 * bq * rA, bowY - .03 * bq, .19 * bq * rA, .1 * bq * rA, .3 + .6 * (1 - rA) - sw);
      if (tl > 0) {
        lineSeg(cx, bowY, cx - .16 * bq + sw * bq * .25, bowY + .3 * bq * tl, 1, 1, .58, .72, .9);
        lineSeg(cx, bowY, cx + .16 * bq + sw * bq * .25, bowY + .3 * bq * tl, 1, 1, .58, .72, .9);
      }
      const kr = Math.max(CW * .7, .05 * bq) * easeBack(clamp(tie / .2));
      if (kr > 0) box(cx - kr, bowY - kr, cx + kr, bowY + kr, (i, px, py) => { if ((px - cx) * (px - cx) + (py - bowY) * (py - bowY) < kr * kr) { R[i] = 1; G[i] = .6; B[i] = .75; GL[i] = 64; } });
    }
    if (t > 8.6) {                                     // "Happy Birthday / Qi Xuan" written in
      const span = this.tx1 - this.tx0, w1 = this.tx0 + span * easeInOut((t - 8.6) / 1.4), w2 = this.tx0 + span * easeInOut((t - 9.4) / 1.4);
      for (let i = 0; i < N; i++) {
        const a = this.m1[i], b = this.m2[i], px = PX[i];
        if (a > .3 && px < w1) {
          const e = Math.max(0, 1 - (w1 - px) / (CW * 3)), sh = Math.pow(Math.max(0, Math.sin((px - PY[i] * .5) / S * 2 - t * 1.6)), 12) * .3, L = .62 + .38 * a;
          R[i] = L + e + sh; G[i] = L * .86 + e + sh; B[i] = L * .92 + e + sh; GL[i] = -1;
        } else if (b > .3 && px < w2) {
          const e = Math.max(0, 1 - (w2 - px) / (CW * 3)), gx = clamp((px - this.tx0) / span), L = .66 + .34 * b;
          R[i] = L + e; G[i] = L * (.5 + .2 * gx) + e; B[i] = L * (.66 + .15 * gx) + e; GL[i] = -1;
        }
      }
    }
    if (t > 8) for (let k = 0; k < 6; k++) {           // little glints across the flowers
      const cyc = t * .9 + k * .37, n = Math.floor(cyc), m = this.mops[Math.floor(hash(n * 7 + k) * this.mops.length)];
      if (!m.fl.length) continue;
      const f = m.fl[Math.floor(hash(n * 3 + k * 11) * m.fl.length)], I = Math.sin((cyc - n) * Math.PI);
      put(f.x, f.y, I, I, I, 42);
    }
    if (t > 8.5) {                                     // petals drifting down behind everything
      const pa = clamp((t - 8.5) / 2);
      for (const p of this.petals) {
        const y = (p.ph + t * p.sp) % (H * 1.15) - H * .08, x = p.x + Math.sin(t * p.f + p.ph) * p.sw, i = cellIdx(x, y);
        if (i < 0 || R[i] + G[i] + B[i] > .25) continue;
        const I = .6 * pa; R[i] = I * p.c[0]; G[i] = I * p.c[1]; B[i] = I * p.c[2]; GL[i] = p.g;
      }
    }
  }
});
